version: "2"
sql:
  - engine: "mysql"
    queries: "db/query/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlcdb"
        out: "db/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          # Force *int instead of sql.NullInt32 for nullable exit_code so
          # repository code maps cleanly to domain.Task.ExitCode.
          - column: "tasks.exit_code"
            go_type:
              type: "int"
              pointer: true
