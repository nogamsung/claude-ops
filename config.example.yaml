runtime:
  http_bind_addr: "127.0.0.1:8787"
  db:
    # MySQL DSN. Required. Set via env var MYSQL_DSN to keep secrets out of YAML.
    # When using docker-compose, the host is "mysql:3306".
    # parseTime=true and charset=utf8mb4 are required (NewDB rejects DSNs without them).
    # Example: "claude_ops:secret@tcp(mysql:3306)/claude_ops?parseTime=true&charset=utf8mb4&loc=UTC"
    dsn: ""
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: "5m"
    conn_max_idle_time: "1m"
  log_level: "info"
  tick_interval: "30s"
  worktree_root: ".worktrees"
  prompts_dir: "prompts"
  # GC removes worktrees for failed/cancelled tasks older than this many days.
  # Runs on boot and every 24h. 0 disables GC.
  worktree_retention_days: 7

concurrency:
  # Number of worker slots that may run claude tasks in parallel. The default
  # is 1 (= v1 byte-for-byte behavior). Raise to 2 or 3 only after the spike
  # acceptance gates in docs/specs/parallel-tasks.md §6.5. Capped at 10.
  max_parallel_tasks: 1
  # How long a claimed task may look alive before the periodic safety net
  # marks it orphaned (for the case where the worker crashed without updating
  # status). Should comfortably exceed the longest realistic task length.
  lease_timeout: "60m"
  # Cadence of the orphan reclaimer. Must be < lease_timeout.
  reclaim_interval: "10m"

ci_fix:
  # Opt-in until the operator validates with their own CI. When false the
  # watcher does nothing and worker behavior is identical to v1 (worktree
  # cleanup runs immediately on markDone).
  enabled: false
  # Cap on parent→child fix-chain length (PRD recommends ≤2).
  max_attempts: 2
  # Cadence of `gh pr checks` polling once a PR is being watched.
  poll_interval: "60s"
  # Abandon watching when checks haven't reached terminal state by this long.
  poll_timeout: "30m"
  # When attempts are exhausted, post a single comment on the PR.
  comment_on_exhaustion: true

limits:
  # Daily 上限. 0 이면 weekly_max_tasks 에서 자동 유도 (ceil(weekly/7)).
  # 둘 다 0 이면 무제한.
  daily_max_tasks: 5
  # Weekly 上限. 0 이면 daily_max_tasks * 7 로 자동 설정.
  weekly_max_tasks: 0
  # 주 시작 요일 — 카운터 리셋 기준 (mon|sun|...)
  week_starts_on: "mon"
  # 일/주 카운터 리셋 기준 타임존
  reset_tz: "Asia/Seoul"
  # Cost thresholds for Slack warnings. 0 = disabled (no warnings).
  # When 80% or 100% of the limit is reached, a Slack message is sent once per bucket.
  daily_max_cost_usd: 0    # e.g. 1.00
  weekly_max_cost_usd: 0   # e.g. 5.00

scheduler:
  active_windows:
    - days: ["mon", "tue", "wed", "thu", "fri"]
      start: "09:00"
      end: "18:00"
      tz: "Asia/Seoul"
    - days: ["sat", "sun"]
      start: "10:00"
      end: "20:00"
      tz: "Asia/Seoul"

  # Cron-triggered maintenance tasks (optional).
  # Each task fires according to its cron spec but only within an active window.
  # Tasks count toward the global daily/weekly limit AND their own budget_sub_cap.
  maintenance_tasks: []
  # Example:
  # maintenance_tasks:
  #   - name: "daily-dep-update"
  #     cron: "0 2 * * *"                 # 02:00 every day (5-field standard cron)
  #     repo: "gs97ahn/example"           # must be in github.repos allowlist
  #     prompt_template: "maintenance/dep-update.tmpl"
  #     labels: ["chore", "maintenance"]
  #     budget_sub_cap:
  #       daily: 1
  #       weekly: 3
  #   - name: "weekly-security-scan"
  #     cron: "0 3 * * mon"
  #     repo: "gs97ahn/example"
  #     prompt_template: "maintenance/security-scan.tmpl"
  #     budget_sub_cap:
  #       weekly: 1

github:
  poll_interval: "60s"
  repos:
    - name: "gs97ahn/example"
      default_branch: "main"
      labels: ["claude-ops"]
      reviewers: ["gs97ahn"]
      checks:
        security: true
        perf: false
        # Post-task quality gate: commands run inside the task worktree after
        # Claude finishes but before a PR is opened. First failure aborts the
        # pipeline — PR is not created, worktree is preserved for inspection,
        # task is marked failed with the command output tail.
        # timeout applies per command (default 5m); SIGTERM → 5s → SIGKILL.
        commands:
          - "go build ./..."
          - "go test ./..."
          - "golangci-lint run ./..."
        timeout: "5m"

slack:
  channel_id: "C0XXXXXXX"
  mention_user_id: "U0XXXXXXX"
