version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-claude_ops}
      MYSQL_USER: ${MYSQL_USER:-claude_ops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      # Bind to localhost only — operator may comment this out in production.
      - "127.0.0.1:3306:3306"

  agent:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: claude-ops:latest
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Bind to localhost only — expose via reverse proxy for Slack webhook.
      - "127.0.0.1:8787:8787"
    env_file:
      - ../.env
    environment:
      MYSQL_DSN: "${MYSQL_USER:-claude_ops}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-claude_ops}?parseTime=true&charset=utf8mb4&loc=UTC"
      CONFIG_PATH: /config/config.yaml
    volumes:
      # Config
      - ../config.example.yaml:/config/config.yaml:ro
      # Prompt templates
      - ../prompts:/prompts:ro
      # Worktrees (must be RW — Claude modifies files here)
      - ../.worktrees:/worktrees
      # Claude Code session (read-only — user must run `claude login` on host first)
      - ${HOME}/.claude:/root/.claude:ro
      # GitHub CLI auth (read-only)
      - ${HOME}/.config/gh:/root/.config/gh:ro
      # git config
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      # claude and gh binaries from host
      - /usr/local/bin/claude:/usr/local/bin/claude:ro
      - /usr/local/bin/gh:/usr/local/bin/gh:ro

volumes:
  mysqldata:
